name: Deploy Frontend

on:
    push:
        branches: [main]
        paths:
            - "src/**"
            - "public/**"
            - "package.json"
            - "pnpm-lock.yaml"
            - "pnpm-workspace.yaml"
            - ".github/workflows/deploy.yml"
    workflow_dispatch:

permissions:
    contents: read
    actions: read

concurrency:
    group: deploy-frontend-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v6

            - name: Install pnpm
              run: npm install -g pnpm

            - name: Cache pnpm store
              uses: actions/cache@v4
              with:
                  path: ~/.local/share/pnpm/store
                  key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

            - name: Install dependencies
              run: pnpm install

            - name: Build frontend
              run: pnpm build

            - name: Upload frontend dist
              uses: actions/upload-artifact@v4
              with:
                  name: dist
                  path: dist/
                  retention-days: 1

    deploy:
        runs-on: ubuntu-latest
        needs: build

        steps:
            - name: Download frontend dist
              uses: actions/download-artifact@v4
              with:
                  name: dist
                  path: ./dist

            - name: Setup SSH
              run: |
                  set -euo pipefail
                  umask 077
                  install -m 700 -d ~/.ssh
                  printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519
                  cat > ~/.ssh/config <<'EOF'
                  Host deploy-jump
                      HostName 69.63.193.86
                      Port 999
                      User root
                  Host deploy-target
                      HostName 192.168.255.201
                      Port 999
                      User root
                      ProxyJump deploy-jump
                  Host deploy-jump deploy-target
                      IdentityFile ~/.ssh/id_ed25519
                      IdentitiesOnly yes
                      BatchMode yes
                      StrictHostKeyChecking accept-new
                      UserKnownHostsFile ~/.ssh/known_hosts
                      ConnectTimeout 15
                      ServerAliveInterval 15
                      ServerAliveCountMax 3
                  EOF
                  chmod 600 ~/.ssh/config
                  ssh deploy-jump 'echo "jump host reachable"'
                  ssh deploy-target 'echo "target host reachable through jump"'
              shell: bash
              env:
                  SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}

            - name: Deploy frontend to server
              run: |
                  set -euo pipefail
                  REMOTE_DIR=/www/tools
                  TEMP_DIR=/www/tools_tmp

                  ssh deploy-target "rm -rf '$TEMP_DIR' && mkdir -p '$TEMP_DIR'"
                  rsync -avz --delete -e ssh dist/ "deploy-target:$TEMP_DIR/"
                  ssh deploy-target "rm -rf '${REMOTE_DIR}_prev' || true
                     if [ -d '$REMOTE_DIR' ]; then mv '$REMOTE_DIR' '${REMOTE_DIR}_prev'; fi
                     mv '$TEMP_DIR' '$REMOTE_DIR'"
              shell: bash
